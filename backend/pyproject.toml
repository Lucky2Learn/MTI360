[project]
name = "mti360-backend"
version = "0.0.0"
description = "MTI 360 API and background workers (FastAPI modular monolith)."
readme = "README.md"
requires-python = ">=3.14,<3.15"
# Lower bounds are the newest versions that satisfied the 7-day supply-chain
# cooldown when T00-02 was implemented. Exact versions are pinned in uv.lock.
# Database, cache and object-storage clients (SQLAlchemy, Alembic, asyncpg,
# Redis, S3) are intentionally NOT dependencies yet; they are added by the task
# that first uses them.
dependencies = [
    "fastapi>=0.141.1,<0.142",
    "uvicorn[standard]>=0.53.0,<0.55",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "httpx>=0.28.1,<0.29",
    "ruff>=0.16.8,<0.17",
    "mypy>=2.3.1,<3",
]

[tool.uv]
# The backend is an application, not a distributable package.
package = false
required-version = ">=0.12.19,<0.13"
# Supply-chain cooldown (T00-02 decision D7): ignore distributions published
# within the last 7 days when resolving.
exclude-newer = "7 days"

# ---------------------------------------------------------------------------
# Ruff — linting, import sorting and formatting
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py314"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # import sorting
    "N",     # naming
    "UP",    # pyupgrade
    "B",     # bugbear
    "SIM",   # simplify
    "C4",    # comprehensions
    "S",     # bandit (security)
    "ASYNC", # async pitfalls
    "DTZ",   # timezone-aware datetimes
    "T20",   # no print statements
    "PT",    # pytest style
    "RUF",   # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert is expected in tests

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------------------
# mypy — strict type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
strict = true
files = ["app", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
