# =============================================================================
# MTI 360 — Alembic configuration (T01-01; ADR-0002 decision 4)
#
# Migrations run as the OWNER role (MIGRATIONS_DATABASE_URL), never as the
# application role. The URL is read from the validated backend settings in
# migrations/env.py; it is deliberately NOT stored here.
#
#   uv run alembic upgrade head          (or: pnpm db:migrate from the root)
#   uv run alembic revision --autogenerate -m "<module>: <change>"
#   uv run alembic check                 (fails when models and migrations differ)
#
# Autogenerated migrations are always reviewed and edited by hand (RLS
# policies, grants and data changes are never autogenerated). One linear
# history; revisions are numbered 0001, 0002, ...
# =============================================================================

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 60
path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
